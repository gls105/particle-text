<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextMorph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      overflow: hidden;
      cursor: none;
    }

    canvas#c {
      display: block;
      position: fixed;
      top: 0; left: 0;
    }

    /* Grain overlay */
    canvas#grain {
      display: block;
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      opacity: 0.045;
      z-index: 10;
    }

    /* Custom cursor */
    #cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 100;
      mix-blend-mode: difference;
    }

    #cursor-ring {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 99;
    }

    /* Dot nav */
    #dot-nav {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 200;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .dot.active {
      background: #ffffff;
      transform: scale(1.35);
    }

    .dot:hover {
      background: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<canvas id="grain"></canvas>
<div id="cursor"></div>
<div id="cursor-ring"></div>

<div id="dot-nav"></div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const PHRASES        = ["Dream Big", "Create More", "Stay Curious", "Build Things"];
const GAP            = 4;         // pixel sampling gap — lower = more particles
const HOLD_MS        = 2400;      // ms to hold each phrase
const FORM_EAS       = 0.06;      // spring ease toward target (initial form)
const MORPH_EAS      = 0.072;     // spring ease during fluid morph
const PARTICLE_COLOR = "#ffffff";
const CURSOR_RADIUS  = 90;        // px — magnetic repulsion radius
const REPEL_STRENGTH = 5.5;       // repulsion force multiplier
// ─────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
const grain  = document.getElementById("grain");
const gctx   = grain.getContext("2d");

let W, H, fontSize;
let particles  = [];
let phraseIdx  = 0;
let phase      = "forming";
let holdStart  = 0;

// ── Mouse ─────────────────────────────────────────────────────────────────────
const mouse      = { x: -999, y: -999 };
const cursorDot  = document.getElementById("cursor");
const cursorRing = document.getElementById("cursor-ring");
let ringX = -999, ringY = -999;

window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  cursorDot.style.left = mouse.x + "px";
  cursorDot.style.top  = mouse.y + "px";
});

// Smooth lagging ring
(function animateRing() {
  ringX += (mouse.x - ringX) * 0.12;
  ringY += (mouse.y - ringY) * 0.12;
  cursorRing.style.left = ringX + "px";
  cursorRing.style.top  = ringY + "px";
  requestAnimationFrame(animateRing);
})();

// ── Cursor Trail Particles ────────────────────────────────────────────────────
const trail = [];

class TrailParticle {
  constructor() {
    this.x       = mouse.x;
    this.y       = mouse.y;
    this.vx      = (Math.random() - 0.5) * 1.4;
    this.vy      = (Math.random() - 0.5) * 1.4;
    this.r       = 1.2 + Math.random() * 1.6;
    this.life    = 0;
    this.maxLife = 30 + Math.random() * 22;
    this.alpha   = 0;
  }

  update() {
    this.x  += this.vx + (mouse.x - this.x) * 0.01;
    this.y  += this.vy + (mouse.y - this.y) * 0.01;
    this.vx *= 0.93;
    this.vy *= 0.93;
    this.life++;
    const t    = this.life / this.maxLife;
    this.alpha = (t < 0.2 ? t / 0.2 : 1 - (t - 0.2) / 0.8) * 0.5;
  }

  draw() {
    if (this.alpha <= 0) return;
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }

  get dead() { return this.life >= this.maxLife; }
}

let trailTick = 0;

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  W = canvas.width  = grain.width  = window.innerWidth;
  H = canvas.height = grain.height = window.innerHeight;
  fontSize = Math.max(48, Math.min(160, Math.floor(W * 0.11)));
  generateGrain();
}

// ── Animated grain ────────────────────────────────────────────────────────────
let grainFrame = 0;

function generateGrain() {
  const img  = gctx.createImageData(W, H);
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random() * 255 | 0;
    data[i] = data[i+1] = data[i+2] = v;
    data[i+3] = 255;
  }
  gctx.putImageData(img, 0, 0);
}

// ── Sample text pixels ────────────────────────────────────────────────────────
function sampleText(text) {
  const off  = document.createElement("canvas");
  off.width  = W; off.height = H;
  const oc   = off.getContext("2d");
  oc.fillStyle    = "#fff";
  oc.font         = `bold ${fontSize}px 'Inter', system-ui, sans-serif`;
  oc.textAlign    = "center";
  oc.textBaseline = "middle";
  oc.fillText(text, W / 2, H / 2);

  const data   = oc.getImageData(0, 0, W, H).data;
  const points = [];
  for (let y = 0; y < H; y += GAP) {
    for (let x = 0; x < W; x += GAP) {
      if (data[(y * W + x) * 4 + 3] > 128) points.push({ x, y });
    }
  }
  // Shuffle
  for (let i = points.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [points[i], points[j]] = [points[j], points[i]];
  }
  return points;
}

// ── Particle ──────────────────────────────────────────────────────────────────
class Particle {
  constructor(tx, ty) {
    this.tx = tx; this.ty = ty;
    // Spawn from random edge
    const edge = Math.floor(Math.random() * 4);
    if      (edge === 0) { this.x = Math.random() * W; this.y = -20; }
    else if (edge === 1) { this.x = W + 20;            this.y = Math.random() * H; }
    else if (edge === 2) { this.x = Math.random() * W; this.y = H + 20; }
    else                 { this.x = -20;               this.y = Math.random() * H; }
    this.vx    = 0; this.vy = 0;
    this.alpha = 0;
    this.r     = 1.2 + Math.random() * 1.0;
    this.state = "forming";
  }

  retarget(tx, ty) {
    this.tx = tx; this.ty = ty;
    this.state = "morphing";
  }

  scatter() {
    this.state = "dissolving";
    this.vx    = (Math.random() - 0.5) * 5;
    this.vy    = (Math.random() - 0.5) * 5 - 1.2;
  }

  update() {
    if (this.state === "forming" || this.state === "morphing") {
      const ease = this.state === "morphing" ? MORPH_EAS : FORM_EAS;

      // Magnetic repulsion from cursor
      const dx   = this.x - mouse.x;
      const dy   = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let rx = 0, ry = 0;

      if (dist < CURSOR_RADIUS && dist > 0) {
        const force = (1 - dist / CURSOR_RADIUS) * REPEL_STRENGTH;
        rx = (dx / dist) * force * 2.2;
        ry = (dy / dist) * force * 2.2;
      }

      this.x    += (this.tx - this.x) * ease + rx;
      this.y    += (this.ty - this.y) * ease + ry;
      this.alpha = Math.min(1, this.alpha + 0.05);

    } else {
      this.vx   *= 0.97; this.vy *= 0.97;
      this.vy   += 0.10;
      this.x    += this.vx; this.y += this.vy;
      this.alpha = Math.max(0, this.alpha - 0.02);
    }
  }

  draw() {
    if (this.alpha <= 0) return;
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }

  get formed() {
    return (this.state === "forming" || this.state === "morphing") &&
      Math.abs(this.tx - this.x) < 2.5 &&
      Math.abs(this.ty - this.y) < 2.5 &&
      this.alpha > 0.9;
  }

  get gone() { return this.state === "dissolving" && this.alpha <= 0; }
}

// ── Load / morph ──────────────────────────────────────────────────────────────
function loadPhrase(text, morph = false) {
  const targets = sampleText(text);

  if (particles.length === 0) {
    particles = targets.map(t => new Particle(t.x, t.y));
    phase = "forming";
    return;
  }

  const reuse = Math.min(particles.length, targets.length);
  for (let i = 0; i < reuse; i++) particles[i].retarget(targets[i].x, targets[i].y);
  for (let i = reuse; i < targets.length; i++) particles.push(new Particle(targets[i].x, targets[i].y));
  for (let i = targets.length; i < particles.length; i++) particles[i].scatter();

  phase = "forming";
}

// ── Scroll trigger (embed-ready) ──────────────────────────────────────────────
// ── Dot Nav ──────────────────────────────────────────────────────────────────
const dotNav = document.getElementById("dot-nav");
const dots   = [];

PHRASES.forEach((_, i) => {
  const d = document.createElement("div");
  d.className = "dot" + (i === 0 ? " active" : "");
  d.addEventListener("click", () => jumpTo(i));
  dotNav.appendChild(d);
  dots.push(d);
});

function updateDots() {
  dots.forEach((d, i) => d.classList.toggle("active", i === phraseIdx));
}

function jumpTo(idx) {
  if (idx === phraseIdx) return;
  phraseIdx = idx;
  loadPhrase(PHRASES[phraseIdx], true);
  updateDots();
}

// ── Scroll trigger (embed-ready) ──────────────────────────────────────────────
let started = false;

function start() {
  if (started) return;
  started = true;
  loadPhrase(PHRASES[phraseIdx]);
  requestAnimationFrame(tick);
}

new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) start();
}, { threshold: 0.1 }).observe(canvas);

start();

// ── Main loop ─────────────────────────────────────────────────────────────────
function tick(now) {
  requestAnimationFrame(tick);

  // Semi-transparent clear for subtle motion blur depth
  ctx.fillStyle = "rgba(8,8,8,0.84)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = PARTICLE_COLOR;

  // Cursor trail
  if (++trailTick % 2 === 0 && mouse.x > 0) trail.push(new TrailParticle());
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].update(); trail[i].draw();
    if (trail[i].dead) trail.splice(i, 1);
  }

  // Text particles
  let allFormed = true, allGone = true;
  particles.forEach(p => {
    p.update(); p.draw();
    if (!p.formed) allFormed = false;
    if (!p.gone)   allGone   = false;
  });

  if (phase === "dissolving") particles = particles.filter(p => !p.gone);
  ctx.globalAlpha = 1;

  if      (phase === "forming"   && allFormed) { phase = "holding"; holdStart = now; }
  else if (phase === "holding"   && now - holdStart > HOLD_MS) {
    // Fluid morph — no dissolve, warp directly into next phrase
    phraseIdx = (phraseIdx + 1) % PHRASES.length;
    loadPhrase(PHRASES[phraseIdx], true);
    updateDots();
  }
  else if (phase === "dissolving" && allGone) {
    particles = [];
    loadPhrase(PHRASES[phraseIdx]);
  }

  // Refresh grain every 3 frames
  if (++grainFrame % 3 === 0) generateGrain();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
resize();
window.addEventListener("resize", () => { resize(); particles = []; loadPhrase(PHRASES[phraseIdx]); });
</script>
</body>
</html>
