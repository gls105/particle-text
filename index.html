<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextMorph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080808; overflow: hidden; cursor: none; }

    canvas#c    { display: block; position: fixed; top: 0; left: 0; }
    canvas#grain {
      display: block; position: fixed; top: 0; left: 0;
      pointer-events: none; opacity: 0.045; z-index: 10;
    }

    #cursor {
      position: fixed; width: 10px; height: 10px;
      background: #fff; border-radius: 50%;
      pointer-events: none; transform: translate(-50%, -50%);
      z-index: 100; mix-blend-mode: difference;
    }
    #cursor-ring {
      position: fixed; width: 36px; height: 36px;
      border: 1px solid rgba(255,255,255,0.4); border-radius: 50%;
      pointer-events: none; transform: translate(-50%, -50%); z-index: 99;
    }

    #arrow-hint {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 16px;
      z-index: 200; user-select: none; pointer-events: none;
    }
    .arrow-key {
      width: 28px; height: 28px;
      border: 1px solid rgba(255,255,255,0.22); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.35); font-size: 13px;
      font-family: system-ui, sans-serif;
      transition: border-color 0.15s, color 0.15s;
    }
    .arrow-key.pressed { border-color: rgba(255,255,255,0.8); color: rgba(255,255,255,0.9); }
    #phrase-label {
      font-family: system-ui, sans-serif; font-size: 11px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.22); min-width: 90px; text-align: center;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="grain"></canvas>
<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="arrow-hint">
  <div class="arrow-key" id="key-left">&#8592;</div>
  <div id="phrase-label">Dream Big</div>
  <div class="arrow-key" id="key-right">&#8594;</div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const PHRASES        = ["Dream Big", "Create More", "Stay Curious", "Build Things"];
const GAP            = 4;
const HOLD_MS        = 2400;    // how long to show each phrase
const FORM_MS        = 1200;    // time to wait before considering phrase "formed"
const EASE           = 0.065;   // spring ease
const PARTICLE_COLOR = "#ffffff";
const CURSOR_RADIUS  = 90;
const REPEL_STRENGTH = 12;
// ─────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
const grain  = document.getElementById("grain");
const gctx   = grain.getContext("2d");

let W, H, fontSize;
let particles = [];
let phraseIdx = 0;
let phase     = "forming";   // forming | holding | dissolving
let phaseTime = 0;           // timestamp when phase started

// ── Mouse ─────────────────────────────────────────────────────────────────────
const mouse     = { x: -999, y: -999 };
const cursorDot = document.getElementById("cursor");
const cursorRing = document.getElementById("cursor-ring");
let ringX = -999, ringY = -999;

window.addEventListener("mousemove", e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  cursorDot.style.left = mouse.x + "px";
  cursorDot.style.top  = mouse.y + "px";
});

(function animateRing() {
  ringX += (mouse.x - ringX) * 0.12;
  ringY += (mouse.y - ringY) * 0.12;
  cursorRing.style.left = ringX + "px";
  cursorRing.style.top  = ringY + "px";
  requestAnimationFrame(animateRing);
})();

// ── Cursor Trail ──────────────────────────────────────────────────────────────
const trail = [];
let trailTick = 0;

class TrailParticle {
  constructor() {
    this.x = mouse.x; this.y = mouse.y;
    this.vx = (Math.random() - 0.5) * 1.4;
    this.vy = (Math.random() - 0.5) * 1.4;
    this.r  = 1.2 + Math.random() * 1.6;
    this.life = 0; this.maxLife = 30 + Math.random() * 22;
    this.alpha = 0;
  }
  update() {
    this.x += this.vx + (mouse.x - this.x) * 0.01;
    this.y += this.vy + (mouse.y - this.y) * 0.01;
    this.vx *= 0.93; this.vy *= 0.93;
    this.life++;
    const t = this.life / this.maxLife;
    this.alpha = (t < 0.2 ? t / 0.2 : 1 - (t - 0.2) / 0.8) * 0.5;
  }
  draw() {
    if (this.alpha <= 0) return;
    ctx.globalAlpha = this.alpha;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
  }
  get dead() { return this.life >= this.maxLife; }
}

// ── Resize + Grain ────────────────────────────────────────────────────────────
let grainFrame = 0;

function resize() {
  W = canvas.width = grain.width = window.innerWidth;
  H = canvas.height = grain.height = window.innerHeight;
  fontSize = Math.max(48, Math.min(160, Math.floor(W * 0.11)));
  generateGrain();
}

function generateGrain() {
  const img = gctx.createImageData(W, H);
  const d   = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255 | 0;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  gctx.putImageData(img, 0, 0);
}

// ── Sample text pixels ────────────────────────────────────────────────────────
function sampleText(text) {
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const oc  = off.getContext("2d");
  oc.fillStyle = "#fff";
  oc.font = `bold ${fontSize}px 'Inter', system-ui, sans-serif`;
  oc.textAlign = "center"; oc.textBaseline = "middle";
  oc.fillText(text, W / 2, H / 2);
  const data = oc.getImageData(0, 0, W, H).data;
  const pts  = [];
  for (let y = 0; y < H; y += GAP)
    for (let x = 0; x < W; x += GAP)
      if (data[(y * W + x) * 4 + 3] > 128) pts.push({ x, y });
  for (let i = pts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pts[i], pts[j]] = [pts[j], pts[i]];
  }
  return pts;
}

// ── Particle ──────────────────────────────────────────────────────────────────
class Particle {
  constructor(tx, ty) {
    this.tx = tx; this.ty = ty;
    const edge = Math.floor(Math.random() * 4);
    if      (edge === 0) { this.x = Math.random() * W; this.y = -20; }
    else if (edge === 1) { this.x = W + 20;            this.y = Math.random() * H; }
    else if (edge === 2) { this.x = Math.random() * W; this.y = H + 20; }
    else                 { this.x = -20;               this.y = Math.random() * H; }
    this.vx = 0; this.vy = 0;
    this.alpha = 0;
    this.r = 1.2 + Math.random() * 1.0;
    this.alive = true;
  }

  retarget(tx, ty) { this.tx = tx; this.ty = ty; }

  scatter() {
    this.alive = false;
    this.vx = (Math.random() - 0.5) * 5;
    this.vy = (Math.random() - 0.5) * 5 - 1.2;
  }

  update() {
    if (this.alive) {
      // Magnetic repulsion
      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let rx = 0, ry = 0;
      if (dist < CURSOR_RADIUS && dist > 0) {
        const f = (1 - dist / CURSOR_RADIUS) * REPEL_STRENGTH;
        rx = (dx / dist) * f;
        ry = (dy / dist) * f;
      }
      this.x += (this.tx - this.x) * EASE + rx;
      this.y += (this.ty - this.y) * EASE + ry;
      this.alpha = Math.min(1, this.alpha + 0.05);
    } else {
      this.vx *= 0.97; this.vy *= 0.97; this.vy += 0.10;
      this.x += this.vx; this.y += this.vy;
      this.alpha = Math.max(0, this.alpha - 0.02);
    }
  }

  draw() {
    if (this.alpha <= 0) return;
    ctx.globalAlpha = this.alpha;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
  }

  get gone() { return !this.alive && this.alpha <= 0; }
}

// ── Phrase management ─────────────────────────────────────────────────────────
function setPhrase(idx, now) {
  phraseIdx = ((idx % PHRASES.length) + PHRASES.length) % PHRASES.length;
  const targets = sampleText(PHRASES[phraseIdx]);

  const reuse = Math.min(particles.length, targets.length);
  for (let i = 0; i < reuse; i++) particles[i].retarget(targets[i].x, targets[i].y);
  for (let i = reuse; i < targets.length; i++) particles.push(new Particle(targets[i].x, targets[i].y));
  for (let i = targets.length; i < particles.length; i++) particles[i].scatter();

  // Timer-based phase: wait FORM_MS then hold, don't wait for allFormed
  phase     = "forming";
  phaseTime = now || performance.now();
  updateLabel();
}

// ── Arrow key UI ──────────────────────────────────────────────────────────────
const phraseLabel = document.getElementById("phrase-label");
const keyLeft     = document.getElementById("key-left");
const keyRight    = document.getElementById("key-right");

function updateLabel() { phraseLabel.textContent = PHRASES[phraseIdx]; }

function flashKey(el) {
  el.classList.add("pressed");
  setTimeout(() => el.classList.remove("pressed"), 180);
}

window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { flashKey(keyRight); setPhrase(phraseIdx + 1); }
  if (e.key === "ArrowLeft")  { flashKey(keyLeft);  setPhrase(phraseIdx - 1); }
});

// ── Start ─────────────────────────────────────────────────────────────────────
let started = false;

function start(now) {
  if (started) return;
  started = true;
  setPhrase(0, now);
  requestAnimationFrame(tick);
}

new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) start();
}, { threshold: 0.1 }).observe(canvas);

start();

// ── Main loop ─────────────────────────────────────────────────────────────────
function tick(now) {
  requestAnimationFrame(tick);

  ctx.fillStyle = "rgba(8,8,8,0.84)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = PARTICLE_COLOR;

  // Trail
  if (++trailTick % 2 === 0 && mouse.x > 0) trail.push(new TrailParticle());
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].update(); trail[i].draw();
    if (trail[i].dead) trail.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].gone) particles.splice(i, 1);
  }

  ctx.globalAlpha = 1;

  const elapsed = now - phaseTime;

  if (phase === "forming" && elapsed > FORM_MS) {
    phase     = "holding";
    phaseTime = now;
  } else if (phase === "holding" && elapsed > HOLD_MS) {
    setPhrase(phraseIdx + 1, now);
  }

  if (++grainFrame % 3 === 0) generateGrain();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
resize();
window.addEventListener("resize", () => { resize(); setPhrase(phraseIdx); });
</script>
</body>
</html>
