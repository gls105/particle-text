<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Text</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Config ──────────────────────────────────────────────────────────────────
const PHRASES   = ["Dream Big", "Create More", "Stay Curious", "Build Things"];
const GAP       = 5;       // pixel sampling gap — lower = more particles (slower)
const HOLD_MS   = 2200;    // ms to hold each phrase before dissolving
const FORM_EAS  = 0.055;   // spring speed pulling particle to target
const PARTICLE_COLOR = "#ffffff";
// ────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");

let W, H, fontSize;
let particles  = [];
let phraseIdx  = 0;
let phase      = "forming"; // forming | holding | dissolving
let holdStart  = 0;

// ── Resize ───────────────────────────────────────────────────────────────────
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  fontSize = Math.max(48, Math.min(160, Math.floor(W * 0.11)));
}

// ── Sample text pixels from an offscreen canvas ──────────────────────────────
function sampleText(text) {
  const off  = document.createElement("canvas");
  off.width  = W;
  off.height = H;
  const oc   = off.getContext("2d");

  oc.fillStyle    = "#fff";
  oc.font         = `bold ${fontSize}px system-ui, sans-serif`;
  oc.textAlign    = "center";
  oc.textBaseline = "middle";
  oc.fillText(text, W / 2, H / 2);

  const data   = oc.getImageData(0, 0, W, H).data;
  const points = [];
  for (let y = 0; y < H; y += GAP) {
    for (let x = 0; x < W; x += GAP) {
      if (data[(y * W + x) * 4 + 3] > 128) points.push({ x, y });
    }
  }
  // Shuffle so particles don't always arrive in raster order
  for (let i = points.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [points[i], points[j]] = [points[j], points[i]];
  }
  return points;
}

// ── Particle class ────────────────────────────────────────────────────────────
class Particle {
  constructor(tx, ty) {
    this.reset(tx, ty);
  }

  reset(tx, ty) {
    this.tx   = tx;
    this.ty   = ty;
    // Spawn from a random edge or screen scatter
    const edge = Math.floor(Math.random() * 4);
    if      (edge === 0) { this.x = Math.random() * W; this.y = -20; }
    else if (edge === 1) { this.x = W + 20;            this.y = Math.random() * H; }
    else if (edge === 2) { this.x = Math.random() * W; this.y = H + 20; }
    else                 { this.x = -20;               this.y = Math.random() * H; }
    this.vx     = 0;
    this.vy     = 0;
    this.alpha  = 0;
    this.r      = 1.2 + Math.random() * 1.0;
    this.state  = "forming";
  }

  retarget(tx, ty) {
    this.tx    = tx;
    this.ty    = ty;
    this.state = "forming";
  }

  scatter() {
    this.state = "dissolving";
    this.vx    = (Math.random() - 0.5) * 6;
    this.vy    = (Math.random() - 0.5) * 6 - 1.5;
  }

  update() {
    if (this.state === "forming") {
      const dx = this.tx - this.x;
      const dy = this.ty - this.y;
      this.x    += dx * FORM_EAS;
      this.y    += dy * FORM_EAS;
      this.alpha = Math.min(1, this.alpha + 0.04);
    } else {
      this.vx   *= 0.97;
      this.vy   *= 0.97;
      this.vy   += 0.12; // gentle gravity
      this.x    += this.vx;
      this.y    += this.vy;
      this.alpha = Math.max(0, this.alpha - 0.022);
    }
  }

  draw() {
    if (this.alpha <= 0) return;
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }

  get formed() {
    return this.state === "forming" &&
      Math.abs(this.tx - this.x) < 1.5 &&
      Math.abs(this.ty - this.y) < 1.5 &&
      this.alpha > 0.92;
  }

  get gone() {
    return this.state === "dissolving" && this.alpha <= 0;
  }
}

// ── Build / transition to a phrase ───────────────────────────────────────────
function loadPhrase(text) {
  const targets = sampleText(text);

  if (particles.length === 0) {
    // First load — create all fresh
    particles = targets.map(t => new Particle(t.x, t.y));
    phase = "forming";
    return;
  }

  // Reuse existing particles, reset or retarget
  const reuse = Math.min(particles.length, targets.length);
  for (let i = 0; i < reuse; i++) {
    particles[i].retarget(targets[i].x, targets[i].y);
  }
  // Need more?
  for (let i = reuse; i < targets.length; i++) {
    particles.push(new Particle(targets[i].x, targets[i].y));
  }
  // Too many? — scatter the extras
  for (let i = targets.length; i < particles.length; i++) {
    particles[i].scatter();
  }

  phase = "forming";
}

function dissolveAll() {
  phase = "dissolving";
  particles.forEach(p => p.scatter());
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function tick(now) {
  requestAnimationFrame(tick);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = PARTICLE_COLOR;

  let allFormed = true;
  let allGone   = true;

  particles.forEach(p => {
    p.update();
    p.draw();
    if (!p.formed) allFormed = false;
    if (!p.gone)   allGone   = false;
  });

  // Prune gone particles after dissolve
  if (phase === "dissolving") {
    particles = particles.filter(p => !p.gone);
  }

  ctx.globalAlpha = 1;

  if (phase === "forming" && allFormed) {
    phase     = "holding";
    holdStart = now;
  } else if (phase === "holding" && now - holdStart > HOLD_MS) {
    dissolveAll();
  } else if (phase === "dissolving" && allGone) {
    phraseIdx = (phraseIdx + 1) % PHRASES.length;
    particles = [];
    loadPhrase(PHRASES[phraseIdx]);
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
resize();
window.addEventListener("resize", () => {
  resize();
  particles = [];
  loadPhrase(PHRASES[phraseIdx]);
});

loadPhrase(PHRASES[phraseIdx]);
requestAnimationFrame(tick);
</script>
</body>
</html>
